# BusLink Kafka topics - the single source of truth for topic settings.
#
# Read by create-topics.sh (the kafka-init container) every time the stack starts.
# Adding a line creates the topic; raising partitions or changing a config updates it.
# Partitions can only go up, never down (Kafka limitation).
#
# Keys decide ordering: every event with the same key lands in the same partition,
# so GPS is keyed by busId and money by cardId. Counts are starting values for
# local runs and get revisited under load in Sprint 7.
#
# Retention: 1 day = 86400000 ms, 3 days = 259200000, 30 days = 2592000000
#
# topic                    partitions  configs (comma separated)                key       producer
telemetry.gps.raw          12          cleanup.policy=delete,retention.ms=259200000   # busId     ingestion-gateway
fare.taps                  6           cleanup.policy=delete,retention.ms=2592000000  # cardId    ingestion-gateway
route.updated              1           cleanup.policy=compact                         # routeId   route-service
bus.position               12          cleanup.policy=compact                         # busId     tracking-service
bus.eta                    6           cleanup.policy=delete,retention.ms=86400000    # stopId    tracking-service
bus.occupancy              6           cleanup.policy=compact                         # busId     tracking-service
fare.trip-completed        6           cleanup.policy=delete,retention.ms=2592000000  # cardId    fare-service
wallet.debit-requested     6           cleanup.policy=delete,retention.ms=2592000000  # cardId    fare-service (outbox)
wallet.debited             6           cleanup.policy=delete,retention.ms=2592000000  # cardId    wallet-service (outbox)
wallet.debit-failed        6           cleanup.policy=delete,retention.ms=2592000000  # cardId    wallet-service (outbox)
wallet.denylist            1           cleanup.policy=compact                         # cardId    wallet-service

# Not listed here: <topic>.retry-* and <topic>.dlt are created by Spring Kafka
# through the Admin API when a consumer with retries starts (14 days retention).
