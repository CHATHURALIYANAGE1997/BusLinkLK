# Starts the local infrastructure (infra/docker-compose.yml) on a GitHub runner
# and checks that every service is healthy and correctly configured.
# Runs only when infra files change, plus on demand.
name: Infra smoke test

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-smoke.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  infra-smoke:
    name: infra-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE: docker compose -f infra/docker-compose.yml --profile ui

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Validate compose file
        run: $COMPOSE config --quiet

      - name: Default start is the lean core (Kafka UI only with --profile ui)
        run: |
          core=$(docker compose -f infra/docker-compose.yml config --services | sort | paste -sd,)
          echo "core: $core"
          test "$core" = "kafka,kafka-init,postgres,redis,schema-registry"

      - name: Pull images
        run: |
          failed=0
          for img in $($COMPOSE config --images); do
            if out=$(docker pull -q "$img" 2>&1); then
              echo "pulled $img"
            else
              echo "::error title=image pull failed::${img}: $(echo "$out" | tail -1)"
              failed=1
            fi
          done
          exit $failed

      - name: Start infrastructure and wait until healthy
        run: $COMPOSE up -d --wait --wait-timeout 240

      - name: Show container status
        run: $COMPOSE ps

      - name: kafka-init finished successfully
        run: |
          code=$(docker wait buslink-kafka-init)
          docker logs buslink-kafka-init
          test "$code" = "0"

      - name: Every topic in topics.conf exists with its partitions and configs
        run: |
          KT="$COMPOSE exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092"
          KC="$COMPOSE exec -T kafka /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:29092"
          described=$($KT --describe --exclude-internal)
          configs=$($KC --describe --entity-type topics)
          failed=0
          while read -r name partitions cfg _; do
            [[ -z "$name" || "$name" == \#* ]] && continue
            actual=$(echo "$described" | awk -v t="$name" '$1=="Topic:" && $2==t { for (i=1;i<=NF;i++) if ($i=="PartitionCount:") print $(i+1) }')
            if [ "$actual" != "$partitions" ]; then
              echo "::error title=topic partitions::$name has '${actual:-missing}' partitions, expected $partitions"; failed=1; continue
            fi
            IFS=',' read -ra kvs <<< "$cfg"
            for kv in "${kvs[@]}"; do
              echo "$configs" | awk -v t="$name" '/^Dynamic configs for topic/ { cur=$5; next } cur==t { print $1 }' | grep -qxF "$kv" \
                || { echo "::error title=topic config::$name is missing $kv"; failed=1; }
            done
            echo "ok  $name  $partitions partitions  $cfg"
          done < infra/kafka/topics.conf
          exit $failed

      - name: Running kafka-init again changes nothing
        run: |
          expected=$(grep -cvE '^[[:space:]]*(#|$)' infra/kafka/topics.conf)
          out=$($COMPOSE run --rm kafka-init)
          echo "$out"
          echo "$out" | grep -q "done: 0 created, 0 updated, ${expected} unchanged, 0 warnings"

      - name: Broker refuses to auto-create topics
        run: |
          $COMPOSE exec -T kafka /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:29092 \
            --describe --entity-type brokers --entity-name 1 --all | grep -E '^ +auto.create.topics.enable=false '

      - name: Kafka accepts a topic and a message
        run: |
          $COMPOSE exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --topic smoke.test --partitions 1 --replication-factor 1
          echo "hello-buslink" | $COMPOSE exec -T kafka /opt/kafka/bin/kafka-console-producer.sh \
            --bootstrap-server kafka:29092 --topic smoke.test
          msg=$($COMPOSE exec -T kafka /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server kafka:29092 --topic smoke.test --from-beginning --max-messages 1 --timeout-ms 20000)
          echo "consumed: $msg"
          test "$msg" = "hello-buslink"

      - name: Schema Registry answers on the host port
        run: |
          curl -fsS http://localhost:8091/subjects
          curl -fsS http://localhost:8091/config | grep -i '"BACKWARD"'

      - name: Kafka UI is up on the host port
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8089/actuator/health | grep -q UP; then echo "Kafka UI up"; exit 0; fi
            sleep 3
          done
          echo "Kafka UI did not come up"; exit 1

      - name: PostgreSQL has one database per service, PostGIS in route
        run: |
          dbs=$($COMPOSE exec -T postgres psql -U buslink -d postgres -Atc \
            "select string_agg(datname || ':' || pg_get_userbyid(datdba), ',' order by datname) from pg_database where datname in ('route','fare','wallet','analytics')")
          echo "databases: $dbs"
          test "$dbs" = "analytics:analytics,fare:fare,route:route,wallet:wallet"
          $COMPOSE exec -T -e PGPASSWORD=route postgres psql -h localhost -U route -d route -Atc "select postgis_full_version()" | head -c 120; echo
          $COMPOSE exec -T -e PGPASSWORD=route postgres psql -h localhost -U route -d route -Atc \
            "select ST_AsText(ST_SetSRID(ST_MakePoint(80.2170, 6.0329), 4326))"

      - name: Redis answers PONG
        run: test "$($COMPOSE exec -T redis redis-cli ping)" = "PONG"

      - name: Show logs on failure
        if: failure()
        run: |
          $COMPOSE ps -a
          $COMPOSE logs --no-color --tail 200
          # Also raise one annotation per service so the failure is visible on the PR
          # without opening the raw log.
          for svc in $($COMPOSE config --services); do
            state=$($COMPOSE ps -a --format '{{.State}} {{.Health}} {{.Status}}' "$svc" 2>/dev/null | head -1)
            tail=$($COMPOSE logs --no-color --no-log-prefix --tail 15 "$svc" 2>&1 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=infra-smoke ${svc}::state=[${state:-not created}]%0A${tail}"
          done

      - name: Stop and remove everything
        if: always()
        run: $COMPOSE down -v
